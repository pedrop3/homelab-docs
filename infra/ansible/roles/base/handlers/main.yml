---
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: Restart zramswap
  ansible.builtin.systemd_service:
    name: zramswap
    state: restarted
  when: not ansible_check_mode or 'zram-tools' in ansible_facts.packages  # dry run: skip until zram-tools is installed
