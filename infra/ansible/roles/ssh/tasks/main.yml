---
# Safety first: never turn off passwords before a key login is in place.
- name: Look up the login user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Check the user's authorized_keys
  ansible.builtin.stat:
    path: "{{ ansible_facts['getent_passwd'][ansible_user][4] }}/.ssh/authorized_keys"
  register: authorized_keys

- name: Refuse to continue without an SSH key on the server
  ansible.builtin.assert:
    that:
      - authorized_keys.stat.exists
      - authorized_keys.stat.size > 0
    fail_msg: >-
      {{ ansible_user }} has no ~/.ssh/authorized_keys. Run
      `ssh-copy-id {{ ansible_user }}@{{ inventory_hostname }}` first,
      or this role would lock you out.

- name: Make sure sshd reads the drop-in directory
  ansible.builtin.command: grep -qE '^Include /etc/ssh/sshd_config.d/\*\.conf' /etc/ssh/sshd_config
  changed_when: false
  check_mode: false

# "00-" sorts before Ubuntu's 50-cloud-init.conf, which can set
# PasswordAuthentication yes. In sshd the first value read wins.
- name: Allow SSH with keys only
  ansible.builtin.template:
    src: 00-homelab.conf.j2
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Apply the SSH settings now
  ansible.builtin.meta: flush_handlers

- name: Read the SSH settings sshd is really using
  ansible.builtin.command: sshd -T
  register: sshd_effective
  changed_when: false
  check_mode: false

- name: Confirm password login is off
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout_lines"
      - "'permitrootlogin no' in sshd_effective.stdout_lines"
    fail_msg: Another file in /etc/ssh/sshd_config.d overrides these settings.
  # A dry run doesn't write 00-homelab.conf, so sshd still shows the old values.
  when: not ansible_check_mode
