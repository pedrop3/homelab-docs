---
# Server settings. Connection details (IP, user, key) come from ../homelab.tfvars.

# Where service data lives. Must match `data_dir` in the OpenTofu stacks.
data_root: /srv/homelab

# --- Who may connect ---
# trusted_lan_hosts (your own devices on the home network) is set in
# ../local.yml, which is git-ignored. See local.yml.example.

# The whole home network, detected from the server's own IP. Not trusted by
# default; add it to trusted_lan_hosts to trust every device on the LAN.
lan_cidr: "{{ ansible_facts['default_ipv4']['network'] }}/{{ ansible_facts['default_ipv4']['prefix'] }}"

# Tailscale devices (100.64.0.0/10) are added when tailscale_enabled is true.
# Which of them may reach the server is decided by the tailnet's access
# controls in the Tailscale admin console.
trusted_networks: "{{ trusted_lan_hosts + (['100.64.0.0/10'] if tailscale_enabled | bool else []) }}"

# --- Remote access (phone app outside the house) ---
# true installs Tailscale. Log in with TS_AUTHKEY=tskey-... make host,
# or once by hand: ssh -t <server> sudo tailscale up
tailscale_enabled: true
tailscale_hostname: homelab

# --- Host tuning (old laptop with an SSD) ---
laptop_ignore_lid: true    # keep running with the lid closed
journald_max_use: 200M     # cap logs on disk
zram_percent: 50           # compressed swap in RAM, % of RAM
docker_log_max_size: 10m   # per container log file
docker_log_max_files: 3
