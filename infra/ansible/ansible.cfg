[defaults]
roles_path = roles
# The inventory comes from ../homelab.tfvars (see ../Makefile).
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
# accept-new: trust a new server's key the first time (e.g. after a reinstall
# where you ran `make reinstalled`), but still refuse a key that CHANGED.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
